# ============================================================
# MedMatch - scheduled job refresh (GitHub Actions)
#
# Placement: .github/workflows/update-jobs.yml in your repo.
#
# What it does:
#   - Every Monday at 04:00 UTC (and via the manual "Run workflow"
#     button): checks out the repo, installs Python + the embedding
#     model library, runs collector.py, and commits the refreshed
#     data.js AND embeddings.js (the AI-similarity fingerprints).
#   - GitHub Pages then republishes the site automatically.
#
# One-time setup:
#   Repo -> Settings -> Secrets and variables -> Actions ->
#   "New repository secret" for each of:
#     JOOBLE_KEY     = your Jooble key
#     RAPIDAPI_KEY   = your RapidAPI key
# ============================================================

name: Refresh jobs

on:
  schedule:
    - cron: '0 4 * * 1'   # every Monday at 04:00 UTC
  workflow_dispatch:       # adds a manual "Run workflow" button

permissions:
  contents: write          # needed to commit refreshed data

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies (for semantic embeddings)
        run: pip install sentence-transformers

      - name: Run collector
        env:
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python collector.py
          python filter_jobs.py

      - name: Commit updated data.js + embeddings.js (if changed)
        run: |
          git config user.name "medmatch-bot"
          git config user.email "actions@github.com"
          git add data.js embeddings.js
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh jobs + embeddings (scheduled run)"
          git push
