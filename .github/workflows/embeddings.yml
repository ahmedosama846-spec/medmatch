# MedMatch — rebuild semantic job embeddings.
# Runs every Monday 06:00 UTC (after the job sync, so new postings get
# vectors the same morning), plus on demand from the Actions tab.
# Commits embeddings.js only when it actually changed.
name: Rebuild job embeddings

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — after the weekly job sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the embedding model stack
        run: pip install --no-cache-dir sentence-transformers

      - name: Regenerate embeddings.js from data.js
        run: python make_embeddings.py

      - name: Commit embeddings.js (only if changed)
        run: |
          if [ -z "$(git status --porcelain embeddings.js)" ]; then
            echo "Embeddings unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "medmatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add embeddings.js
          git commit -m "chore: rebuild job embeddings ($(date +%Y-%m-%d))"
          git push
